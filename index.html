<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--gm:#4CAF7D;--gd:#2E7D52;--gl:#E8F5EE;--gml:#C8E6D4;--gp:#F0FAF4;--w:#FFF;--td:#1A3A2A;--tm:#3D6B52;--tl:#6B9E80;--b:#B8DEC8;}
  body,html,input,button{font-family:'Sarabun',sans-serif;}
  .page{display:none;flex-direction:column;background:var(--gp);}
  .page.active{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* LOGIN */
  .lw{display:flex;align-items:center;justify-content:center;flex:1;padding:2rem;background:linear-gradient(135deg,#E8F5EE,#C8E6D4);overflow-y:auto;}
  .lc{background:var(--w);border:2px solid var(--gml);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(76,175,125,.12);}
  .la{text-align:center;margin-bottom:2rem;}
  .li{width:72px;height:72px;background:var(--gl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;border:3px solid var(--gml);}
  .li i{font-size:54px;color:var(--gd);}
  .lt{font-size:33px;font-weight:700;color:var(--td);}
  .ls{font-size:22.5px;color:var(--tm);margin-top:6px;font-weight:500;}
  .fg{margin-bottom:1.25rem;}
  .fl{font-size:24px;color:var(--td);margin-bottom:8px;display:block;font-weight:600;}
  .fi{width:100%;padding:13px 16px;border:2px solid var(--gml);border-radius:12px;font-size:25.5px;color:var(--td);background:var(--gp);outline:none;}
  .fi:focus{border-color:var(--gm);box-shadow:0 0 0 4px rgba(76,175,125,.15);}
  .fi:disabled{opacity:.6;}
  .fi::placeholder{color:var(--tl);}
  .bg{padding:14px 20px;background:var(--gm);color:#fff;border:none;border-radius:12px;font-size:25.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:background .2s;}
  .bg:hover:not(:disabled){background:var(--gd);}
  .bg:disabled{opacity:.6;cursor:not-allowed;}
  .em{font-size:21px;color:#c0392b;margin-top:10px;text-align:center;display:none;font-weight:500;}
  .sp{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* TOPBAR */
  .tb{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;border-bottom:2px solid var(--gml);background:var(--w);position:sticky;top:0;z-index:10;flex-shrink:0;transition:background .2s;}
  .tb.co{background:var(--gd);border-bottom-color:var(--gd);}
  .tbl{display:flex;align-items:center;gap:12px;}
  .tlo{width:40px;height:40px;background:var(--gl);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gml);}
  .tb.co .tlo{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);}
  .tlo i{font-size:30px;color:var(--gd);}
  .tb.co .tlo i{color:#fff;}
  .tn{font-size:25.5px;font-weight:700;color:var(--td);}
  .tb.co .tn{color:#fff;}
  .tbr{display:flex;align-items:center;gap:8px;}
  /* USER MENU */
  .um{position:relative;}
  .ub{display:flex;align-items:center;gap:8px;background:var(--gl);border:2px solid var(--gml);border-radius:20px;padding:6px 14px 6px 8px;cursor:pointer;transition:all .2s;}
  .ub:hover{background:var(--gml);}
  .tb.co .ub{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);}
  .tb.co .ub:hover{background:rgba(255,255,255,.25);}
  .uav{width:30px;height:30px;background:var(--gm);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .uav i{font-size:24px;color:#fff;}
  .un{font-size:19.5px;font-weight:700;color:var(--td);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb.co .un{color:#fff;}
  .uch{font-size:18px;color:var(--tl);transition:transform .2s;}
  .tb.co .uch{color:rgba(255,255,255,.7);}
  .um.open .uch{transform:rotate(180deg);}
  .ud{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--w);border:2px solid var(--gml);border-radius:14px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.1);overflow:hidden;z-index:100;}
  .um.open .ud{display:block;}
  .udh{padding:12px 16px;background:var(--gl);border-bottom:1.5px solid var(--gml);}
  .uda{font-size:19.5px;font-weight:700;color:var(--td);}
  .uds{font-size:16.5px;color:var(--tm);margin-top:2px;font-weight:500;}
  .udi{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:21px;font-weight:600;color:var(--tm);cursor:pointer;transition:background .15s;}
  .udi:hover{background:var(--gp);color:var(--gd);}
  .udi i{font-size:24px;width:20px;text-align:center;}
  .udd{height:1.5px;background:var(--gml);}
  .udi.danger{color:#c0392b;}
  .udi.danger:hover{background:#fdecea;}
  .cb{padding:9px 16px;background:var(--gm);color:#fff;border:none;border-radius:10px;font-size:22.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .2s;}
  .cb:hover{background:var(--gd);}
  .tb.co .cb{background:rgba(255,255,255,.2);}
  .tb.co .cb:hover{background:rgba(255,255,255,.3);}

  /* MAIN */
  .mb{display:flex;flex:1;min-height:0;position:relative;overflow:hidden;}
  .sb{width:20%;max-width:180px;min-width:64px;flex-shrink:0;border-right:2px solid var(--gml);background:var(--w);overflow-y:auto;min-height:0;}
  .csl{font-size:15px;font-weight:700;color:var(--tl);padding:.75rem .6rem .3rem;text-transform:uppercase;letter-spacing:.5px;}
  .csl-set{font-size:15px;font-weight:700;padding:.75rem .6rem .3rem;text-transform:uppercase;letter-spacing:.5px;color:#7B3FA0;}
  .ci{padding:8px .6rem;font-size:18px;font-weight:600;color:var(--tm);cursor:pointer;display:flex;align-items:center;gap:5px;border-left:3px solid transparent;transition:all .15s;}
  .ci:hover{background:var(--gp);color:var(--gd);}
  .ci.active{color:var(--gd);border-left-color:var(--gm);background:var(--gl);font-weight:700;}
  .ci-set{padding:8px .6rem;font-size:16.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;border-left:3px solid transparent;transition:all .15s;color:#7B3FA0;border-radius:0;}
  .ci-set:hover{background:#F3E8FF;color:#5B2D80;}
  .ci-set.active{color:#5B2D80;border-left-color:#9C4DC8;background:#EDD9FF;font-weight:700;}
  .sb-divider{height:1.5px;background:var(--gml);margin:.5rem .6rem;}
  .ci i{font-size:24px;flex-shrink:0;}
  .cch{margin-left:auto;font-size:18px;transition:transform .2s;color:var(--tl);}
  .ci.open .cch{transform:rotate(180deg);}
  .sg{overflow:hidden;max-height:0;transition:max-height .25s ease;background:var(--gp);}
  .sg.open{max-height:800px;}
  .si{padding:6px .6rem 6px 1.4rem;font-size:16.5px;font-weight:500;color:var(--tm);cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:4px;}
  .si:hover{background:var(--gl);color:var(--gd);}
  .si.active{color:var(--gd);border-left-color:var(--gm);background:var(--gml);font-weight:700;}

  /* CATALOG */
  .cat{flex:1;min-height:0;padding:1.25rem;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .srb{margin-bottom:1.25rem;position:relative;}
  .srb i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:30px;color:var(--tl);}
  .sri{width:100%;padding:12px 16px 12px 44px;border:2px solid var(--gml);border-radius:12px;font-size:24px;background:var(--w);color:var(--td);outline:none;font-weight:500;}
  .sri:focus{border-color:var(--gm);}
  .sri::placeholder{color:var(--tl);}
  .sh{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
  .sic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gl);border:1.5px solid var(--gml);}
  .sic i{font-size:30px;color:var(--gd);}
  .stl{font-size:27px;font-weight:700;color:var(--td);}
  .ssu{font-size:21px;color:var(--tm);font-weight:500;}
  .scb{margin-bottom:2rem;}
  .sbh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--gl);border-radius:10px;margin-bottom:10px;border-left:4px solid var(--gm);}
  .sbt{font-size:22.5px;font-weight:700;color:var(--gd);}
  .sbc{font-size:18px;color:var(--tl);margin-left:auto;background:var(--w);padding:2px 8px;border-radius:20px;border:1px solid var(--b);}
  .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
  .pc{background:var(--w);border:2px solid var(--gml);border-radius:14px;padding:.75rem;display:flex;flex-direction:column;gap:0;transition:border-color .2s,box-shadow .2s;}
  .pc:hover{border-color:var(--gm);box-shadow:0 4px 16px rgba(76,175,125,.15);}
  .pi{width:100%;aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;flex-shrink:0;}
  .pn{font-size:19.5px;font-weight:700;color:var(--td);line-height:1.3;margin-bottom:4px;}
  .pu{font-size:18px;color:var(--tl);font-weight:500;margin-top:auto;}
  .pp{font-size:24px;font-weight:700;color:var(--gd);margin-top:4px;}
  .pp span{font-size:18px;color:var(--tl);font-weight:500;}
  .qr{display:flex;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--gml);}
  .qb{width:30px;height:30px;border:2px solid var(--b);background:var(--gp);color:var(--td);font-size:27px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .qb:first-child{border-radius:8px 0 0 8px;}
  .qb:last-child{border-radius:0 8px 8px 0;}
  .qb.pl{background:var(--gl);color:var(--gd);border-color:var(--gm);}
  .qb.pl:hover,.qb:hover{background:var(--gml);}
  .qn{width:36px;height:30px;border-top:2px solid var(--b);border-bottom:2px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:22.5px;font-weight:700;color:var(--td);background:var(--w);}

  /* CART PANEL */
  .cp{display:none;position:absolute;top:0;right:0;width:310px;height:100%;background:var(--w);border-left:2px solid var(--gml);flex-direction:column;z-index:9;}
  .cp.open{display:flex;}
  .ch{padding:1rem 1.25rem;border-bottom:2px solid var(--gml);display:flex;justify-content:space-between;align-items:center;background:var(--gl);}
  .cht{font-size:24px;font-weight:700;color:var(--td);}
  .cc{background:none;border:none;cursor:pointer;color:var(--tm);font-size:33px;}
  .cmi{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:8px;}
  .cit{background:var(--gp);border:1.5px solid var(--gml);border-radius:12px;padding:10px 12px;}
  .ct{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;}
  .cif{flex:1;min-width:0;}
  .cn{font-size:19.5px;font-weight:700;color:var(--td);line-height:1.4;}
  .cu{font-size:18px;color:var(--tl);margin-top:2px;font-weight:500;}
  .cd{background:none;border:none;cursor:pointer;color:var(--tl);font-size:24px;flex-shrink:0;}
  .cd:hover{color:#e74c3c;}
  .cbot{display:flex;align-items:center;justify-content:space-between;}
  .mq{display:flex;align-items:center;}
  .mqb{width:26px;height:26px;border:2px solid var(--b);background:var(--w);color:var(--td);font-size:22.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .mqb:first-child{border-radius:6px 0 0 6px;}
  .mqb:last-child{border-radius:0 6px 6px 0;}
  .mqb.pl{background:var(--gl);color:var(--gd);border-color:var(--gm);}
  .mqn{width:30px;height:26px;border-top:2px solid var(--b);border-bottom:2px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;background:var(--w);color:var(--td);}
  .cpr{font-size:21px;font-weight:700;color:var(--gd);}
  .ec{text-align:center;padding:2rem 1rem;color:var(--tl);font-size:22.5px;font-weight:500;}
  .ec i{font-size:60px;display:block;margin-bottom:.75rem;}
  .cf{padding:1rem 1.25rem;border-top:2px solid var(--gml);display:flex;flex-direction:column;gap:10px;background:var(--gp);}
  .ctr{display:flex;justify-content:space-between;align-items:baseline;}
  .ctl{font-size:22.5px;color:var(--tm);font-weight:600;}
  .ctv{font-size:33px;font-weight:700;color:var(--td);}
  .bog{width:100%;padding:11px;background:var(--w);border:2.5px solid var(--gm);color:var(--gd);border-radius:10px;font-size:22.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;}
  .bog:hover{background:var(--gl);}

  /* PROFILE */
  .stb{height:64px;display:flex;align-items:center;padding:0 1.5rem;border-bottom:2px solid var(--gml);background:var(--w);gap:14px;flex-shrink:0;}
  .bkb{background:var(--gp);border:2px solid var(--gml);border-radius:10px;padding:8px 16px;font-size:22.5px;font-weight:600;color:var(--tm);cursor:pointer;display:flex;align-items:center;gap:7px;}
  .bkb:hover{background:var(--gl);}
  .stt{font-size:27px;font-weight:700;color:var(--td);}
  .pb{flex:1;overflow-y:auto;padding:1.5rem;}
  .pcard{background:var(--w);border:2px solid var(--gml);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;}
  .pct{font-size:24px;font-weight:700;color:var(--gd);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1.5px solid var(--gml);}
  .pct i{font-size:27px;}
  .pgr{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .pgr .full{grid-column:1/-1;}
  .pfg{display:flex;flex-direction:column;gap:6px;}
  .pfl{font-size:21px;font-weight:700;color:var(--td);}
  .pfl .req{color:#c0392b;}
  .pfi{padding:11px 14px;border:2px solid var(--gml);border-radius:10px;font-size:22.5px;color:var(--td);background:var(--gp);outline:none;font-family:'Sarabun',sans-serif;font-weight:500;width:100%;}
  .pfi:focus{border-color:var(--gm);box-shadow:0 0 0 3px rgba(76,175,125,.12);}
  .pfi::placeholder{color:var(--tl);}
  .pfi:disabled{opacity:.7;cursor:not-allowed;background:#f5f5f5;}
  .branch-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .branch-opt{display:flex;align-items:center;gap:8px;padding:12px 16px;border:2px solid var(--gml);border-radius:12px;cursor:pointer;flex:1;min-width:120px;font-size:17px;font-weight:600;color:var(--tm);transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none;}
  .branch-opt:hover{border-color:var(--gm);background:var(--gl);}
  .branch-opt.selected{border-color:var(--gm);background:var(--gl);color:var(--gd);}
  .branch-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--b);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
  .branch-opt.selected .branch-radio{border-color:var(--gm);background:var(--gm);}
  .branch-opt.selected .branch-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;display:block;}
  .pf{padding:1.25rem 1.5rem;border-top:2px solid var(--gml);background:var(--w);flex-shrink:0;display:flex;align-items:center;gap:12px;}
  .bsv{flex:1;padding:13px;background:var(--gm);color:#fff;border:none;border-radius:12px;font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Sarabun',sans-serif;transition:background .2s;}
  .bsv:hover:not(:disabled){background:var(--gd);}
  .bsv:disabled{opacity:.6;cursor:not-allowed;}
  .sm{font-size:21px;font-weight:600;padding:10px 14px;border-radius:10px;display:none;align-items:center;gap:8px;flex-shrink:0;}
  .sm.ok{background:#E8F5EE;color:var(--gd);border:2px solid var(--gml);display:flex;}
  .sm.err{background:#fdecea;color:#c0392b;border:2px solid #f5c6cb;display:flex;}

  /* REVIEW */
  .rvb{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;}
  .rhr{display:grid;grid-template-columns:1fr 80px 88px 84px 36px;gap:8px;padding:0 10px 10px;border-bottom:2px solid var(--gml);margin-bottom:4px;}
  .rhr span{font-size:19.5px;font-weight:700;color:var(--tl);text-transform:uppercase;}
  .rhr span:not(:first-child){text-align:center;}
  .rrw{display:grid;grid-template-columns:1fr 80px 88px 84px 36px;gap:8px;align-items:center;padding:12px 10px;border-bottom:1.5px solid var(--gml);}
  .rrw:hover{background:var(--gp);border-radius:10px;}
  .rn{font-size:21px;font-weight:700;color:var(--td);line-height:1.4;}
  .rs{font-size:18px;color:var(--tl);margin-top:2px;}
  .rup{font-size:19.5px;color:var(--tm);text-align:center;font-weight:600;}
  .rqc{display:flex;align-items:center;justify-content:center;}
  .rqb{width:26px;height:26px;border:2px solid var(--b);background:var(--gp);color:var(--td);font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .rqb:first-child{border-radius:6px 0 0 6px;}
  .rqb:last-child{border-radius:0 6px 6px 0;}
  .rqb.pl{background:var(--gl);color:var(--gd);border-color:var(--gm);}
  .rqn{width:30px;height:26px;border-top:2px solid var(--b);border-bottom:2px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:19.5px;font-weight:700;color:var(--td);background:var(--w);}
  .rtp{font-size:21px;font-weight:700;color:var(--gd);text-align:center;}
  .rdl{background:none;border:none;cursor:pointer;color:var(--tl);font-size:27px;display:flex;align-items:center;justify-content:center;}
  .rdl:hover{color:#e74c3c;}
  .rem{text-align:center;padding:4rem 2rem;color:var(--tl);font-size:24px;font-weight:500;}
  .rem i{font-size:48px;display:block;margin-bottom:1rem;}
  .rft{border-top:2px solid var(--gml);padding:1.25rem 1.5rem;background:var(--w);flex-shrink:0;}
  .rsm{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .rsl{font-size:21px;color:var(--tm);font-weight:600;}
  .rsl strong{font-size:39px;font-weight:700;color:var(--td);display:block;margin-top:2px;}
  .rsr{font-size:21px;color:var(--tm);text-align:right;font-weight:600;}

  /* MODAL */
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;align-items:center;justify-content:center;}
  .ov.show{display:flex;}
  .mo{background:var(--w);border-radius:20px;padding:2rem;width:400px;max-width:92%;border:2px solid var(--gml);}
  .mot{font-size:30px;font-weight:700;color:var(--td);margin-bottom:.4rem;}
  .mos{font-size:22.5px;color:var(--tm);margin-bottom:1.25rem;font-weight:500;}
  .osb{background:var(--gp);border-radius:12px;padding:1rem;margin-bottom:1.25rem;max-height:200px;overflow-y:auto;border:1.5px solid var(--gml);}
  .osr{display:flex;justify-content:space-between;font-size:19.5px;padding:4px 0;color:var(--td);gap:8px;font-weight:500;}
  .osr span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .osr span:last-child{white-space:nowrap;font-weight:700;}
  .ost{display:flex;justify-content:space-between;font-size:24px;font-weight:700;border-top:2px solid var(--gml);padding-top:8px;margin-top:6px;color:var(--td);}
  .mac{display:flex;gap:10px;}
  .bcl{flex:1;padding:12px;background:none;border:2px solid var(--b);border-radius:10px;font-size:24px;font-weight:600;cursor:pointer;color:var(--tm);font-family:'Sarabun',sans-serif;}
  .bcl:hover{background:var(--gp);}
  .bco{flex:1;padding:12px;background:var(--gm);color:#fff;border:none;border-radius:10px;font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Sarabun',sans-serif;}
  .bco:hover:not(:disabled){background:var(--gd);}
  .bco:disabled{opacity:.6;cursor:not-allowed;}
  .sca{text-align:center;padding:.5rem 0 1rem;}

// แยก unit ออกเป็น 2 ส่วน: ประเภท (ขวด/แผง/กล่อง) และขนาด
function splitUnit(raw){
  const m=(raw||'').match(/^([^\s(]+)([\s(].+)?$/);
  const type=m?m[1].trim():raw;
  const size=m&&m[2]?m[2].trim():'';
  return{type,size};
}

// ข้อมูลสินค้า — โหลดจาก Supabase
let P=[], TR={}, CATS=[];

async function loadProducts(){
  try{
    const res=await fetch(
      `${SB_URL}/rest/v1/products?select=*&order=id`,
      {headers:SB_H}
    );
    if(!res.ok){console.error('loadProducts HTTP',res.status,await res.text());return;}
    const rows=await res.json();
    if(!Array.isArray(rows)){console.error('loadProducts: not array',rows);return;}
    if(rows.length===0){console.warn('loadProducts: empty');return;}
    P=rows.map(r=>{
      const rawUnit=r['หน่วย']||'';
      const{type,size}=splitUnit(rawUnit);
      const baseName=r['ยี่ห้อ']||'';
      const name=size?`${baseName} ${size}`:baseName;
      const cat=r['กลุ่มยา']||'อื่นๆ';
      const style=CAT_STYLE[cat]||{icon:'ti-pill',bg:'#E8F5EE',ic:'#2E7D52'};
      return{
        cat, sub:r['หมวดหมู่ย่อย']||'',
        name, unit:type,
        price:Number(r['ราคา']||r['ราคา/หน่วย']||0),
        icon:style.icon, bg:style.bg, ic:style.ic,
        image_url:r['image_url']||null
      };
    });
    // เรียงตัวอักษรไทยก่อนอังกฤษ
    const thaiSort=(a,b)=>{
      const isThaiA=/^[\u0E00-\u0E7F]/.test(a);
      const isThaiB=/^[\u0E00-\u0E7F]/.test(b);
      if(isThaiA&&!isThaiB)return -1;
      if(!isThaiA&&isThaiB)return 1;
      return a.localeCompare(b,'th');
    };
    P.sort((a,b)=>thaiSort(a.name,b.name));
    TR={};
    P.forEach(p=>{
      if(!TR[p.cat])TR[p.cat]=[];
      if(p.sub&&!TR[p.cat].includes(p.sub))TR[p.cat].push(p.sub);
    });
    // เรียงหมวดย่อยแต่ละหมวด
    Object.keys(TR).forEach(cat=>{TR[cat].sort(thaiSort);});
    CATS=Object.keys(TR);
    console.log('loadProducts OK:',P.length,'รายการ');
  }catch(e){
    console.error('loadProducts error',e);
  }
}

let _sets=[],_bnIdx=0,_bnTimer=null;
const SET_COLORS=[
  {from:'#4CAF7D',to:'#2E7D52'},{from:'#1565C0',to:'#0D47A1'},
  {from:'#E65100',to:'#BF360C'},{from:'#6A1B9A',to:'#4A148C'},
  {from:'#AD1457',to:'#880E4F'},{from:'#00695C',to:'#004D40'},
  {from:'#F57F17',to:'#E65100'},{from:'#283593',to:'#1A237E'},
];

async function loadSets(){
  try{
    // ดึง product_sets และ product_set_items พร้อมกันเลย ไม่รอทีละ request
    const [sRes,iRes]=await Promise.all([
      fetch(`${SB_URL}/rest/v1/product_sets?select=*&order=total_price.asc`,{headers:SB_H}),
      fetch(`${SB_URL}/rest/v1/product_set_items?select=*`,{headers:SB_H})
    ]);
    const [sets,items]=await Promise.all([sRes.json(),iRes.json()]);
    if(!Array.isArray(sets)||!sets.length){_sets=[];return;}
    const allItems=Array.isArray(items)?items:[];
    _sets=sets.map((s,si)=>{
      const clr=SET_COLORS[si%SET_COLORS.length];
      const setItems=allItems
        .filter(i=>i.set_id===s.id)
        .map(i=>{
          const style={icon:'ti-pill',bg:'#E8F5EE',ic:'#2E7D52'};
          return{
            name:i.product||'',unit:i.unit||'',
            price:Number(i.price||0),qty:Number(i.qty||1),
            image_url:null,icon:style.icon,bg:style.bg,ic:style.ic
          };
        });
      return{
        id:s.id,name:s.name||'',desc:s.description||'',
        total_price:Number(s.total_price||0),
        from:clr.from,to:clr.to,items:setItems
      };
    });
    // เรียงตาม total_price น้อยไปมาก (รองรับ Supabase ที่อาจส่งมาไม่ครบ)
    _sets.sort((a,b)=>a.total_price-b.total_price);
    // อัปเดตสีตาม index ใหม่หลังเรียง
    _sets.forEach((s,i)=>{const clr=SET_COLORS[i%SET_COLORS.length];s.from=clr.from;s.to=clr.to;});
    console.log('loadSets OK:',_sets.length,'เซ็ต');
  }catch(e){console.error('loadSets',e);_sets=[];}
}

function buildBanner(){
  const wrap=document.getElementById('bannerWrap');
  const track=document.getElementById('bannerTrack');
  const dots=document.getElementById('bannerDots');
  if(!_sets.length){wrap.style.display='none';dots.style.display='none';return;}
  wrap.style.display='block';dots.style.display='flex';
  track.innerHTML=_sets.map((s,i)=>`<div class="banner-slide" data-si="${i}">
    <div class="banner-slide-inner" style="background:linear-gradient(135deg,${s.from},${s.to})">
      <div class="banner-deco"></div><div class="banner-deco2"></div>
      <div class="banner-tag">🎯 เซ็ตแนะนำ</div>
      <div class="banner-title">${s.name}</div>
      ${s.desc?`<div class="banner-desc">${s.desc}</div>`:''}
      <div class="banner-footer">
        <span class="banner-nitems">${s.items.length} รายการ · ฿${s.total_price>0?s.total_price.toLocaleString('th-TH'):s.items.reduce((t,it)=>t+it.price*it.qty,0).toLocaleString('th-TH')}</span>
        <span class="banner-cta">ดูเซ็ต →</span>
      </div>
    </div></div>`).join('');
  dots.innerHTML=_sets.map((_,i)=>`<div class="banner-dot${i===0?' active':''}" data-bi="${i}"></div>`).join('');
  track.onclick=e=>{const sl=e.target.closest('[data-si]');if(sl)openSetModal(Number(sl.dataset.si));};
  dots.onclick=e=>{const d=e.target.closest('[data-bi]');if(d)goBanner(Number(d.dataset.bi));};
  document.getElementById('bnPrev').onclick=e=>{e.stopPropagation();goBanner((_bnIdx-1+_sets.length)%_sets.length);};
  document.getElementById('bnNext').onclick=e=>{e.stopPropagation();goBanner((_bnIdx+1)%_sets.length);};
  startBannerAuto();
}
function goBanner(idx){
  _bnIdx=idx;
  document.getElementById('bannerTrack').style.transform=`translate3d(-${idx*100}%,0,0)`;
  document.querySelectorAll('.banner-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  resetBannerAuto();
}
function startBannerAuto(){if(_bnTimer)clearInterval(_bnTimer);if(_sets.length>1)_bnTimer=setInterval(()=>goBanner((_bnIdx+1)%_sets.length),4500);}
function resetBannerAuto(){clearInterval(_bnTimer);startBannerAuto();}

function addSetToCart(){
  if(!_curSet)return;
  // 1. update cart data ก่อน (เบา ไม่แตะ DOM)
  _curSet.items.forEach(it=>{
    const key=it.name+'||'+it.unit;
    if(!cart[key])cart[key]={qty:0,name:it.name,unit:it.unit,price:it.price};
    cart[key].qty+=it.qty;
  });
  // 2. ปิด modal ทันที ให้ user เห็นว่า responsive
  document.getElementById('setOv').classList.remove('show');
  updBtn();
  // 3. update DOM ที่เหลือใน frame ถัดไป ไม่บล็อก UI
  requestAnimationFrame(()=>{
    syncQ();
    cartOpen=true;
    document.getElementById('cartP').classList.add('open');
    document.getElementById('topbar').classList.add('co');
    renderMini();
    const t=document.createElement('div');t.className='toast-h';
    t.textContent=`✓ เพิ่มเซ็ต "${_curSet.name}" ลงตะกร้าแล้ว`;
    document.body.appendChild(t);setTimeout(()=>t.remove(),2500);

async function doLogin(){
  const ag=document.getElementById('aIn').value.trim();
  const pw=document.getElementById('pIn').value;
  document.getElementById('eMsg').style.display='none';
  if(!ag||!pw){setE('กรุณากรอกชื่อหน่วยงานและรหัสผ่าน');return;}
  setLL(true);
  try{
    const res=await fetch(
      `${SB_URL}/rest/v1/agencies?agency=eq.${encodeURIComponent(ag)}&password=eq.${encodeURIComponent(pw)}&active=eq.true&select=*`,
      {headers:SB_H}
    );
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data))throw new Error('invalid response');
    if(data.length>0){
      const d=data[0];
      user=d.agency;
      prof={contact:d.contact||'',phone:d.phone||'',tax_id:d.tax_id||'',address:d.address||'',branch_type:d.branch_type||'HQ',branch_num:d.branch_num||''};

      setE('ชื่อหน่วยงานหรือรหัสผ่านไม่ถูกต้อง');
      setLL(false);
    }
  }catch(e){
    console.error('login error',e);
    setE('เชื่อมต่อไม่ได้ กรุณาลองใหม่');
    setLL(false);
  }
}

async function goHistory(){
  document.getElementById('uMenu').classList.remove('open');
  showPage('pgH');
  const el=document.getElementById('histBody');
  el.innerHTML='<div class="hload">⏳ กำลังโหลดประวัติ...</div>';
  try{
    // ดึง orders ของ user นี้เท่านั้น
    const res=await fetch(
      `${SB_URL}/rest/v1/orders?agency=eq.${encodeURIComponent(user)}&select=*&order=created_at.desc`,
      {headers:SB_H}
    );
    const orders=await res.json();
    if(!orders.length){
      el.innerHTML='<div class="hemp"><i class="ti ti-shopping-bag-x"></i><div style="font-size:16px;font-weight:600">ยังไม่มีประวัติการสั่งซื้อ</div></div>';
      return;
    }
    // ดึง items ทุก order ของ user นี้
    const refs=orders.map(o=>`"${o.ref}"`).join(',');
    const iRes=await fetch(
      `${SB_URL}/rest/v1/order_items?order_ref=in.(${refs})&select=*`,
      {headers:SB_H}
    );
    const allItems=await iRes.json();
    // สร้าง map ref -> items
    const itemMap={};
    allItems.forEach(i=>{if(!itemMap[i.order_ref])itemMap[i.order_ref]=[];itemMap[i.order_ref].push(i);});
    // render
    el.innerHTML='<div class="hld">'+orders.map(o=>{
      const items=itemMap[o.ref]||[];
      const total=items.reduce((s,i)=>s+Number(i.qty)*Number(i.price),0);
      const safeRef=o.ref.replace(/"/g,'&quot;');
      return `<div class="hc" id="hc_${safeRef}">
        <div class="hch" onclick="toggleHist('${safeRef}')">
          <div class="hcl">
            <div class="href">📋 ${o.ref}</div>
            <div class="hdate">🗓 ${o.timestamp||''}</div>
            <div class="hnitems">${items.length} รายการ</div>
          </div>
          <div class="hcr">
            <div class="htotal">฿${total.toLocaleString('th-TH',{minimumFractionDigits:2})}</div>
            <i class="ti ti-chevron-down harr"></i>
          </div>
        </div>
        <div class="hbd">
          <div class="hitl">รายการสินค้า</div>
          ${items.map(i=>`
          <div class="hit">
            <div style="flex:1;min-width:0">
              <div class="hitn">${i.product||''}</div>
              <div class="hitu">${i.unit||''}</div>
            </div>
            <div class="hitq">×${i.qty}</div>
            <div class="hitp">฿${(Number(i.qty)*Number(i.price)).toLocaleString('th-TH',{minimumFractionDigits:2})}</div>
          </div>`).join('')}
          <div class="hact">
            <button class="hbtn" onclick="reorder('${safeRef}')">
              <i class="ti ti-shopping-cart-plus"></i>สั่งซื้อซ้ำ — นำเข้าตะกร้า
            </button>
          </div>
        </div>
      </div>`;
    }).join('')+'</div>';
    // เก็บ items ไว้ใช้ตอน reorder
    window._histItems=itemMap;
  }catch(e){
    el.innerHTML='<div class="hemp"><i class="ti ti-wifi-off"></i><div>โหลดข้อมูลไม่สำเร็จ</div></div>';
  }
}

function toggleHist(ref){
  const el=document.getElementById('hc_'+ref);
  if(el)el.classList.toggle('open');
}

function reorder(ref){
  const items=window._histItems&&window._histItems[ref];
  if(!items||!items.length)return;
  let added=0;
  items.forEach(i=>{
    const key=i.product+'||'+i.unit;
    if(!cart[key])cart[key]={qty:0,name:i.product,unit:i.unit,price:Number(i.price)};
    cart[key].qty+=Number(i.qty);
    added++;
  });
  updBtn();
  // แสดง toast แล้วกลับหน้าหลัก
  const t=document.createElement('div');
  t.className='toast-h';
  t.innerHTML='<i class="ti ti-check" style="margin-right:6px"></i>เพิ่ม '+added+' รายการลงตะกร้าแล้ว';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
  showPage('pgC');
  // เปิดตะกร้าอัตโนมัติ
  cartOpen=true;
  document.getElementById('cartP').classList.add('open');
  document.getElementById('topbar').classList.add('co');
  renderMini();
}

async function saveProfile(){
  const contact=document.getElementById('pCt').value.trim();
  const phone=document.getElementById('pPh').value.trim();
  const tax_id=document.getElementById('pTx').value.trim();
  const address=['pA1','pSd','pDt','pPv','pZp'].map(id=>document.getElementById(id).value.trim()).filter(Boolean).join('  ');
  // branch
  const isBR=document.getElementById('optBR').classList.contains('selected');
  const branch_type=isBR?'BR':'HQ';
  const branch_num=isBR?(document.getElementById('pBn').value.trim()||'00000'):'';
  if(isBR&&!document.getElementById('pBn').value.trim()){
    const sm=document.getElementById('sMsg');
    sm.className='sm err';sm.innerHTML='⚠️ กรุณากรอกเลขที่สาขา';sm.style.display='flex';return;

  btn.disabled=true;btn.innerHTML='<span class="sp"></span> กำลังบันทึก...';sm.style.display='none';

      `${SB_URL}/rest/v1/agencies?agency=eq.${encodeURIComponent(user)}`,
      {method:'PATCH',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify({contact,phone,tax_id,address,branch_type,branch_num})}
    );

}

  document.getElementById('pdMinus').onclick=()=>pdChQ(-1);

    const p2=_pIdx[_pdIdx];if(!p2)return;
    const k=p2.name+'||'+p2.unit;

function addNoImg(wrap,p){
  const EMOJI={'ti-pill':'💊','ti-lungs':'🤧','ti-stethoscope':'🩺','ti-shield-check':'🛡️','ti-bottle':'🧴','ti-flask':'⚗️','ti-droplet':'💧','ti-band-aid':'🩹','ti-eye':'👁️','ti-roll':'🧻','ti-mask':'😷','ti-hand-stop':'🧤','ti-circle':'🔵','ti-first-aid-kit':'🏥'};
  const d=document.createElement('div');
  d.className='pd-no-img';
  d.textContent=EMOJI[p.icon]||'💊';
  wrap.appendChild(d);
}

function pdChQ(d){
  const el=document.getElementById('pdQty');
  const cur=Number(el.textContent)||0;
  el.textContent=Math.max(0,cur+d);
}

function closePD(e){
  if(e&&e.target!==document.getElementById('pdOv'))return;
  document.getElementById('pdOv').classList.remove('show');
  _pdIdx=null;
}

function chQ(idx,d){
  const p=_pIdx[idx];if(!p)return;
  const key=p.name+'||'+p.unit;
  if(!cart[key])cart[key]={qty:0,name:p.name,unit:p.unit,price:p.price};
  cart[key].qty=Math.max(0,cart[key].qty+d);
  if(cart[key].qty===0)delete cart[key];
  // อัปเดตแค่ตัวเลขใน card นั้น ไม่ต้อง re-render ทั้งหน้า
  document.querySelectorAll(`[data-qn="${idx}"]`).forEach(el=>{el.textContent=cart[key]?cart[key].qty:0;});
  updBtn();if(cartOpen)renderMini();
}

function syncQ(){
  // อัปเดตเฉพาะสินค้าที่อยู่ในตะกร้า ไม่ต้อง loop ทั้งหมด
  // reset ทุก data-qn เป็น 0 ก่อน แล้วค่อย set เฉพาะที่มีในตะกร้า
  document.querySelectorAll('[data-qn]').forEach(el=>{el.textContent=0;});
  Object.entries(cart).forEach(([key,v])=>{
    _pIdx.forEach((p,idx)=>{
      if(p&&p.name+'||'+p.unit===key){
        document.querySelectorAll(`[data-qn="${idx}"]`).forEach(el=>{el.textContent=v.qty;});
      }
    });
  });
}

        customer_addr:addr,
        customer_phone:prof.phone||'',
        customer_tax:prof.tax_id||''
      })
    });
    if(!oRes.ok)throw new Error('order failed');

    // 2. บันทึก order_items
    const items=its.map(([,v])=>({order_ref:ref,product:v.name,unit:v.unit,qty:v.qty,price:v.price}));
    const iRes=await fetch(`${SB_URL}/rest/v1/order_items`,{
      method:'POST',
      headers:{...SB_H,'Prefer':'return=minimal'},
      body:JSON.stringify(items)
    });
    if(!iRes.ok)throw new Error('items failed');

    cart={};updBtn();
    document.getElementById('mBody').innerHTML=`<div class="sca"><i class="ti ti-circle-check si"></i>
    <div class="sc1">ส่งใบสั่งซื้อเรียบร้อยแล้ว</div>
    <div class="sc2">บันทึกลง Supabase แล้ว<br>พนักงานจะติดต่อกลับเพื่อยืนยัน</div>
    <div class="rb">เลขอ้างอิง: ${ref}</div></div>
    <div style="margin-top:1.5rem;"><button class="bg" onclick="afterOrd()">กลับหน้าสินค้า</button></div>`;
  }catch{
    btn.disabled=false;
    btn.innerHTML='ยืนยัน';
    document.getElementById('mBody').innerHTML+=`<div style="color:#c0392b;font-size:13px;margin-top:8px;text-align:center">เกิดข้อผิดพลาด กรุณาลองใหม่</div>`;
  }
}
function afterOrd(){closeOv();cartOpen=false;document.getElementById('cartP').classList.remove('open');document.getElementById('topbar').classList.remove('co');showPage('pgC');syncQ();}
function closeOv(){document.getElementById('overlay').classList.remove('show');}
// ===== AUTO-RESTORE SESSION (F5) =====
(async()=>{
  const sess=loadSession();
  if(sess&&sess.user){
    user=sess.user;
    prof=sess.prof||{};
    await enterApp();
  }
})();
</script>
